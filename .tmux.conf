unbind -a
set -g prefix M-b
unbind C-b
bind M-b send-prefix

unbind -T prefix '"'
unbind -T prefix %

bind d detach-client
bind a send-prefix
bind c new-window
bind n next-window
bind p previous-window
bind & kill-window
bind x kill-pane
bind s choose-session
bind : command-prompt
bind '$' command-prompt -I "#S" "rename-session '%%'"
bind , command-prompt -I "#W" "rename-window '%%'"
bind w choose-tree -w

bind | split-window -h
bind - split-window -v
bind z resize-pane -Z
bind [ copy-mode

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection

bind -T prefix 0 select-window -t 0
bind -T prefix 1 select-window -t 1
bind -T prefix 2 select-window -t 2
bind -T prefix 3 select-window -t 3
bind -T prefix 4 select-window -t 4
bind -T prefix 5 select-window -t 5
bind -T prefix 6 select-window -t 6
bind -T prefix 7 select-window -t 7
bind -T prefix 8 select-window -t 8
bind -T prefix 9 select-window -t 9

set -g pane-base-index 1
set -g renumber-windows on
setw -g mode-keys vi

# reload Prefix + r
bind r source-file ~/.tmux.conf \; display-message "Reloaded ~/.tmux.conf"

# style
gray_light="#D8DEE9"
gray_medium="#ABB2BF"
gray_dark="#3B4252"
green_soft="#A3BE8C"
blue_muted="#81A1C1"
cyan_soft="#88C0D0"
gray_dim="#4C566A"

# peformance
set -g pane-border-style "fg=${gray_dark}"
set -g pane-active-border-style "fg=${gray_medium}"

set -g status-position top
set -g status-left-length 100
set -g status-right-length 50
set -g status-style "fg=${gray_light},bg=default"
set -g status-left "#[fg=${blue_muted},bold]  #S " 
set -g window-status-current-format "#[fg=${cyan_soft},bold]  #I:#W"
set -g window-status-format "#[fg=${kray_dim}] #I:#W "
# set -g window-status-format " #I:#W "

set -g @prefix_highlight_fg '#81A1C1'
set -g @prefix_highlight_bg 'default'
set -g @prefix_highlight_copy_mode_attr 'fg=#81A1C1,bg=default,bold'
set -g @prefix_highlight_show_copy_mode 'on'
set -g @prefix_highlight_prefix_prompt ' PREFIX '
set -g @prefix_highlight_copy_prompt ' COPY '

set -g message-style "fg=${gray_light},bg=default"
set -g mode-style "fg=${gray_dark},bg=${blue_muted}"
set -g status-right "#{prefix_highlight}"
set -g status-justify centre

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
